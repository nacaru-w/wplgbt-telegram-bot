services:
  lgbt-telegram-bot:
    image: ghcr.io/nacaru-w/wplgbt-telegram-bot:latest
    restart: unless-stopped
    volumes:
      - bot-data:/usr/src/app/data
      - ./config.json:/usr/src/app/config.json:ro
    deploy:
      resources:
        limits:
          cpus: 0.8
          memory: 400M

volumes:
  bot-data:
